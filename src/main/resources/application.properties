spring.application.name=veterinaria-backend
server.port=8080
server.address=0.0.0.0

# Lee las variables desde el archivo .env (no se sube a GitHub)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
#spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.issuer=veterinaria-san-marcos-api
app.jwt.audience=veterinaria-san-marcos-web

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
